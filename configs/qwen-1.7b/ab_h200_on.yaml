# H200 reader A/B — ON 臂（第二轮，2026-09-17 夜）
#
# 第一轮的结论（见 docs/AB_H200.md / 下面的表格）：
#   1) 同一形状（ctx=1024/M=16）下 ON 全面领先 OFF：按看过的 context 数对齐，
#      192k contexts 时 AR f1 0.469 vs 0.384、em 0.329 vs 0.248、first_token_em 0.556 vs 0.474
#      —— 但那一轮 ON 臂用的是 batch 12（OOM 死在 85%）且没跑完，所以这次要一对**跑完**的。
#   2) 形状比开关影响更大：M=64/ctx=2048（32:1）比 M=16/ctx=1024（64:1）在 240k contexts 时
#      AR f1 +0.126、em +0.130、TF f1 +0.116（都是 1 epoch、global 64）。
#   3) ctx 是显存的主要开销（编码 + AE 两趟全 context 前向），M 几乎免费。
# 所以这一轮：ctx 保持 1024（显存已验证可行），M 提到 64（压缩比 32:1，对齐大形状），
# 并把 max_answer_tokens 从 128 降到 64 —— QA 分支的 full-vocab logits 与序列长度都减半，
# 给最坏形状腾出 ~20 GiB（SQuAD 答案 ≤10 token，无损失）。
#
# 两臂除 6 个开关 + 输出目录外逐字段相同（tests/test_ab_configs.py 断言）。
# 规模：all@ctx=1024 = 252,465 contexts，batch 8 x 8 ranks = 64 => 1 epoch = 3,945 步，
# 约 1.1-1.3 h/臂。cadence: TF 200（20 点）、AR 400（10 点）、save 400、warmup 200（~5%）。
checkpoint:
  output_dir: outputs/ab_h200_on
  save_every_steps: 400
data:
  cache_dataset: true
  cache_sortish_lengths: true
  chat_template_enable_thinking: false
  filter_long_context: true
  filter_no_qa: true
  max_answer_tokens: 64
  max_context_tokens: 1024
  max_question_tokens: 128
  qa_per_context: 4
  root: ${DATA_ROOT:-/data/lz/contexts/aggregated}
  sortish_bucket_multiplier: 50
  test_datasets:
  - squad
  train_datasets: all
  train_max_samples: null
  use_chat_template: false
  validation_datasets:
  - squad
  validation_max_samples: 2000
evaluation:
  autoregressive_every: 400
  autoregressive_max_qa: 128
  max_new_tokens: 32
  qa_batch_size: 4
  teacher_forced_every: 200
logging:
  log_every: 25
  wandb_mode: offline
  wandb_project: MemoryQwen
memory:
  ae_lm_positions: 128
  ae_lm_weight: 1.0
  allow_slot_attention: true
  context_lm_positions: 128
  decoder_ffn_ratio: 2
  decoder_heads: 8
  decoder_hidden_size: 256
  distill_entropy_weight: false
  distill_positions: 128
  distill_temperature: 1.0
  distill_topk: 0
  distill_weight: 0.3
  head_init: auto
  head_mode: tied
  init_mode: token_embed
  init_seed: 0
  memory_length: 64
  qa_weight: 1.0
  readout_heads: 4
  readout_hidden_size: 256
  readout_layers: 2
  readout_length: 8
  reconstruction_cosine_weight: 0.5
  reconstruction_loss: context_lm
  reconstruction_weight: 1.0
model:
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_rank: 8
  name_or_path: ${MODEL_ROOT:-/data/lz/hf_cache/hub}/models--Qwen--Qwen3-1.7B/snapshots/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  torch_dtype: bfloat16
  trainable_dtype: float32
optimizer:
  lr: 0.0001
  name: adamw
  weight_decay: 0.01
scheduler:
  name: cosine
  warmup_steps: 200
training:
  batch_size: 8
  epochs: 1
  max_grad_norm: 1.0
  seed: 42
