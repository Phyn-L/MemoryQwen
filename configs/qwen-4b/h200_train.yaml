model:
  name_or_path: ${MODEL_ROOT:-/data/lz/hf_cache/hub}/models--Qwen--Qwen3-8B/snapshots/b968826d9c46dd6066d109eabc6255188de91218
  torch_dtype: bfloat16
  trainable_dtype: float32
  lora_rank: 8
  lora_alpha: 16.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
memory:
  memory_length: 8
  decoder_hidden_size: 256
  decoder_ffn_ratio: 2
  decoder_heads: 8
  qa_weight: 1.0
  reconstruction_weight: 1.0
  # Context next-token prediction (see the README section "Context next-token
  # prediction objective"). Switch to mse_cosine for the embedding regression.
  reconstruction_loss: context_lm
  context_lm_positions: 256
  reconstruction_cosine_weight: 0.5
  # -------- 记忆读取侧（reader）可选开关，默认全关；说明见 docs/READER_OPTIONS.md --------
  head_mode: linear                # linear | tied（A1：tied 用预训练 tied embedding 打分，省 38.9M 随机参数）
  head_init: auto                  # auto | random | memory_projection（仅 tied 生效）
  init_mode: randn                 # randn | token_embed | vocab_mean（C2）
  init_seed: 0
  allow_slot_attention: false      # true = 槽 k 可看槽 <= k（C2）
  ae_lm_weight: 0.0                # >0 开启 memory 前缀自编码（B2，冻结 backbone + teacher forcing）
  ae_lm_positions: 0               # 0 = 全部 context 位置；省算力可写 256
  distill_weight: 0.0              # B1 KL 蒸馏，需要 ae_lm_weight > 0
  distill_temperature: 1.0
  distill_positions: 256
  distill_entropy_weight: false
  distill_topk: 0
  readout_length: 0                # >0 开启问题期 resampler（C3），建议 4~16
  readout_layers: 2
  readout_heads: 4
  readout_hidden_size: 256
data: {root: "${DATA_ROOT:-/data/lz/contexts/aggregated}", train_datasets: [squad, coqa, drop], validation_datasets: [squad], test_datasets: [squad], max_context_tokens: 2048, max_question_tokens: 128, max_answer_tokens: 128, cache_sortish_lengths: true, cache_dataset: true, use_chat_template: false, chat_template_enable_thinking: false, qa_per_context: 4}
evaluation: {teacher_forced_every: 2000, autoregressive_every: 4000, max_new_tokens: 32, qa_batch_size: 4, autoregressive_max_qa: 2048}
training: {batch_size: 1, epochs: 1, max_grad_norm: 1.0, seed: 42}
optimizer: {name: adamw, lr: 1.0e-4, weight_decay: 0.01}
scheduler: {name: cosine, warmup_steps: 500}
checkpoint: {output_dir: outputs/qwen-8b, save_every_steps: 1000}
logging: {wandb_project: MemoryQwen, wandb_mode: "${WANDB_MODE:-online}"}
