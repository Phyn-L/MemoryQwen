# Conversation 格式数据配置；未列出的字段继承训练基线。
_base_: train_baseline.yaml
data:
  files:
    root: ${DATA_ROOT:-contexts}  # 1QA 数据根目录（validation 子集从这里解析）
    train_conversation_file: ${CONVERSATION_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl  # conversation JSONL（SHINE 语料，独立根目录）
  limits:
    max_context_tokens: 2048  # 覆盖 context token 上限
  task:
    train_stage: only_qa  # 训练阶段
