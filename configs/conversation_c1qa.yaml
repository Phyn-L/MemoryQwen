# Conversation-format C1QA input.
data:
  root: ${DATA_ROOT:-/data/lz/contexts}
  conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl
  train_conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl
  validation_conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl
  test_conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl
  train_tasks: qa
  max_context_tokens: 2048
  max_question_tokens: 96
  max_answer_tokens: 64
  max_conversation_tokens: 768
  max_input_tokens: 40960
  tokenizer_filter_batch_size: 2048
  validation_max_samples: 4096
