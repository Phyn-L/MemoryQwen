# Qwen3-1.7B + 记忆读取侧全开（A1 tied 词表头 / C2 slot 初始化+槽间注意力 / B2 memory 前缀自编码 /
# B1 KL 蒸馏 / C3 问题期 resampler）。目标形状固定：memory_length=8、max_context_tokens=1024
# （约 128x 压缩，属探索性档位；500xCompressor 验证过的是 30-480x，ICAE 是 4x）。
#
# 为什么 batch_size=1：目标机器是 4xRTX4090，24 GiB/卡。显存探针（/data/lz/reader_4090/probe_memory.py，
# 合成最坏形状 = 每条 context 都满 1024 token + qa_per_context 个满长 QA 对，跑完整 ON 损失组合 +
# backward + AdamW 一步）实测：
#     全量 ON 组合    B=1 -> 19.8 GiB allocated / 20.2 GiB reserved；B=2 直接 OOM
#     裁掉次要开销后  B=1 -> 16.6 GiB / 17.2 GiB   <- 本配置（约 7 GiB 余量）；B=2 仍 OOM
# 裁剪了 qa_per_context 4->2、context_lm_positions 256->64、ae_lm_positions 0->256、
# distill_positions 256->128（省的是词表头/蒸馏的次要开销；两个主干前向的开销省不掉）。
# 真实 batch 的 padding 通常短得多，实测运行峰值约 8.6-9.6 GiB。
#
# 规模与时间：train_datasets=all 在该过滤下保留 252,465 条 context（>1024 token 的 3.3% 被丢弃，
# 另有 139 条无可用 QA 对）；全局 batch = 1 x 4 卡 = 4 => 63,116 步/epoch，实测 ~1.5-2 s/step
# => 整轮约 26-35 小时。save_every_steps=2000（约 50-70 分钟一次），可以先跑几小时读
# train/ae_loss、train/reconstruction_loss（memory-only 探针）与 val_teacher_forced/* 的趋势，
# 再决定是否跑满。想更快：ctx 降到 512 可用 batch 2（全局 8，约 10 小时）；或换 8xH200 用 batch 8-16。
#
# 启动（4 卡，PATH 换成该机器的 conda env）：
#   cd /data/lz/MemoryQwen
#   export PATH=/home/lz/miniconda3/envs/shine/bin:$PATH
#   export CUDA_VISIBLE_DEVICES=0,1,2,3 NUM_PROCESSES=4 WANDB_MODE=offline
#   CONFIG=configs/qwen-1.7b/on_4090_all.yaml bash scripts/train.sh
# 逐字段说明与其它可选开关见 docs/READER_OPTIONS.md。
checkpoint:
  output_dir: outputs/reader_4090_on
  save_every_steps: 2000
data:
  cache_dataset: true
  cache_sortish_lengths: true
  chat_template_enable_thinking: false
  filter_long_context: true
  filter_no_qa: true
  max_answer_tokens: 128
  max_context_tokens: 1024
  max_question_tokens: 128
  qa_per_context: 2
  root: ${DATA_ROOT:-/data/lz/contexts/aggregated}
  sortish_bucket_multiplier: 50
  test_datasets:
  - squad
  train_datasets: all
  train_max_samples: null
  use_chat_template: false
  validation_datasets:
  - squad
  validation_max_samples: 256
evaluation:
  autoregressive_every: 5000
  autoregressive_max_qa: 256
  max_new_tokens: 32
  qa_batch_size: 4
  teacher_forced_every: 2000
logging:
  wandb_mode: offline
  wandb_project: MemoryQwen
memory:
  ae_lm_positions: 256
  ae_lm_weight: 1.0
  allow_slot_attention: true
  context_lm_positions: 64
  decoder_ffn_ratio: 2
  decoder_heads: 8
  decoder_hidden_size: 256
  distill_entropy_weight: false
  distill_positions: 128
  distill_temperature: 1.0
  distill_topk: 0
  distill_weight: 0.3
  head_init: auto
  head_mode: tied
  init_mode: token_embed
  init_seed: 0
  memory_length: 8
  qa_weight: 1.0
  readout_heads: 4
  readout_hidden_size: 256
  readout_layers: 2
  readout_length: 8
  reconstruction_cosine_weight: 0.5
  reconstruction_loss: context_lm
  reconstruction_weight: 1.0
model:
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_rank: 8
  name_or_path: ${MODEL_ROOT:-/data/lz/hf_cache/hub}/models--Qwen--Qwen3-1.7B/snapshots/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  torch_dtype: bfloat16
  trainable_dtype: float32
optimizer:
  lr: 0.0001
  name: adamw
  weight_decay: 0.01
scheduler:
  name: cosine
  warmup_steps: 500
training:
  batch_size: 1
  epochs: 1
  max_grad_norm: 1.0
  seed: 42
