# 实验层：Qwen3-1.7B + memory 64。harness（评估/日志/优化/训练）与模型设置来自 _base_。
_base_:
- harness.yaml
- models/qwen3-1.7b.yaml
memory:
  conversation:
    enabled: false
    recompress_threshold: 2048
    max_recompress_tokens: 2048
  # Fixed-length context writer
  memory_length: 128  # 写入固定 memory 的 slot 数
  context_layer_indices: [-1,-2,-3,-4]  # 用于构造 context 表示的 Transformer 层索引
  memory_resampler_layers: 4  # memory resampler 层数
  memory_resampler_heads: 4  # memory resampler 注意力头数
  memory_resampler_hidden_size: 512  # memory resampler 隐藏维度
  memory_resampler_ffn_ratio: 4  # memory resampler 前馈层扩展倍数
  memory_resampler_use_self_attention: true

  # Question-conditioned readout
  readout_mode: memory_question
  readout_length: 16
  question_resampler_info_source: hidden  # 仅 memory_question 使用
  readout_keep_question_tokens: true  # 仅 memory_question 使用
  question_resampler_hidden_size: 512  # question resampler 隐藏维度
  question_resampler_layers: 2  # question resampler 层数
  question_resampler_heads: 4  # question resampler 注意力头数
  question_resampler_ffn_ratio: 4  # question resampler FFN 扩展倍数
  question_resampler_use_self_attention: true
