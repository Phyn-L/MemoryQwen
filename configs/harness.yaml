# 共享 harness：数据过滤/DataLoader、目标权重、优化器、调度、训练超参、评估与日志。
#
# 这一层不能单独运行（没有 memory 结构，也没有模型选择）：实验配置通过
#   _base_: [harness.yaml, models/<模型>.yaml]
training:
  batch_size: 2  # 每个进程的 micro-batch 大小
  gradient_accumulation_steps: 2  # 每个优化器步累积的 micro-batch 数
  gradient_checkpoint_every_n_layers: 2  # 每隔几层启用一次 context gradient checkpoint；1 表示逐层
  epochs: 1  # 训练轮数
  max_grad_norm: 1.0  # 梯度裁剪最大范数
  seed: 42  # 随机种子
  deterministic: true  # 是否启用确定性算法
data:
  # 数据文件路径：1QA 数据由 scripts/data/ 写入 <root>/1qa/
  files:
    root: ${DATA_ROOT:-contexts}  # 数据根目录（含 1qa/meta/ 和 1qa/cache/）
  # 输入长度上限：训练与验证共用这一处配置
  limits:
    max_context_tokens: 1536
    max_input_tokens: 40960
    max_question_tokens: 96
    max_answer_tokens: 64
    max_conversation_tokens: 768
  loader:
    train_num_workers: 4
    train_pin_memory: true
    train_prefetch_factor: 2
    train_persistent_workers: true
    eval_num_workers: 2
    eval_pin_memory: true
    eval_prefetch_factor: 2
    eval_persistent_workers: true
  task:
    # 训练任务类型：mix、qa 或 recon
    train_tasks: mix
    recon_ratio: 0.5
    recon_schedule: decay
    recon_schedule_curve: cosine
    recon_ratio_start: 1.0
    recon_ratio_end: 0.1
    recon_ratio_min: 0.1
    max_qa_sample_per_context: 8
    # sortish bucket 相对 batch size 的倍数
    sortish_bucket_multiplier: 50
    train_datasets: all
    train_max_samples: null
    # 验证集：每数据集抽至多 N 个 context，每个 context 最多取 max_qa_sample_per_context 条 QA。
    validation_datasets: [squad, msmarcov1.1, msmarcov2.1, hotpotqa(distractor), race]
    validation_max_samples: null
loss:
  qa_weight: 1.0  # 问答目标损失权重
  recon_weight: 1.0  # 重建目标损失权重
  distill_weight: 0.0  # 蒸馏目标损失权重，0 表示关闭
  distill_positions: 128  # 每条序列参与蒸馏的位置数，0 表示全部位置
  distill_temperature: 1.0  # 蒸馏 softmax 温度
  distill_topk: 0  # 蒸馏教师分布保留的 top-k，0 表示完整分布
  distill_entropy_weight: true  # 是否按教师分布熵加权蒸馏位置
  max_logits_rows: 256  # 每次词表投影的行数上限（显存/核数量权衡）
evaluation:
  autoregressive_every: 2500  # 自回归验证与 checkpoint 的训练步间隔
  max_eval_contexts_per_dataset: 1024  # 每个数据集的自回归评估 context 数上限
  max_new_tokens: 64  # 自回归验证生成 token 上限
  qa_batch_size: 16  # QA 验证批大小
  recon_teacherforce: true  # teacher-forced recon 指标（无需生成）
  recon_autoregressive: false  # 自回归 recon 评估（昂贵，默认关闭）
optimizer:
  name: adamw  # 优化器名称
  lr: 0.0001  # 学习率
  weight_decay: 0.01  # 权重衰减系数
scheduler:
  name: cosine  # 调度器名称
  warmup_steps: 2500  # 学习率预热步数
checkpoint:
  output_dir: outputs  # 输出根目录，运行时追加 {model-name}/{model-name}_{time}
logging:
  swanlab_run_name: null  # Optional; defaults to model name + timestamp.
  swanlab_host: http://10.24.116.90:8000
  swanlab_mode: online  # online / offline / local / disabled
  swanlab_log_dir: null  # 自动设置为最终 checkpoint 输出目录
  swanlab_workspace: phyn
  log_every: 50  # 训练日志记录间隔（步）
  swanlab_project: MemoryQwen  # SwanLab 项目名称
