# 消融实验共享的 harness 覆盖（评估节奏、batch、warmup、验证集、readout 开关等）。
# 每个消融文件只写“相对基线唯一不同的科学变量”，因此
# tests/test_ab_configs.py 的“一个消融只改一个因子”断言才有意义。
_base_: ../train_baseline.yaml
data:
  limits:
    max_context_tokens: 2048  # 消融统一使用的 context 上限
  task:
    test_datasets: [squad]
    validation_datasets: [squad]
evaluation:
  autoregressive_every: 400
  max_eval_sample_per_dataset: 1024
  max_new_tokens: 32  # 生成 token 上限
  qa_batch_size: 4
memory:
  readout_length: 8  # readout token 数（reader_off 会覆盖为 0）
scheduler:
  warmup_steps: 200
training:
  batch_size: 1
  deterministic: false
