# 消融配置；未列出的字段继承训练基线。
_base_: ../train_baseline.yaml
checkpoint:
  output_dir: outputs/ablation_context_length  # 输出目录
data:
  limits:
    max_context_tokens: 1024  # 覆盖 context token 上限
  task:
    # 测试数据集覆盖项
    test_datasets:  # 覆盖测试数据集
    - squad
    # 验证数据集覆盖项
    validation_datasets:  # 覆盖验证数据集
    - squad
evaluation:
  autoregressive_every: 400  # 自回归验证间隔
  evaluation_max_samples: 1024  # 自回归验证 QA 上限
  max_new_tokens: 32  # 生成 token 上限
  qa_batch_size: 4  # QA 验证批大小
memory:
  readout_length: 8  # readout token 数
scheduler:
  warmup_steps: 200  # 预热步数
training:
  batch_size: 1  # 训练批大小
  deterministic: false  # 是否启用确定性算法
