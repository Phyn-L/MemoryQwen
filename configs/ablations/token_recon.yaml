checkpoint:
  output_dir: outputs/ablation_token_recon
data:
  conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl
  cache_offsets: true
  cache_sortish_lengths: true
  chat_template_enable_thinking: false
  filter_long_context: true
  filter_no_qa: true
  max_answer_tokens: 64
  max_context_tokens: 40960
  max_input_context_length: 8192
  tokenizer_filter_batch_size: 1024
  train_tasks: mix
  recon_ratio: 0.5
  recon_schedule: constant
  recon_schedule_curve: linear
  recon_ratio_start: 0.5
  recon_ratio_end: 0.5
  recon_ratio_min: 0.1
  qa_per_context: 4
  root: ${DATA_ROOT:-/data/lz/contexts/aggregated}
  sortish_bucket_multiplier: 50
  test_datasets:
  - squad
  train_datasets: all
  train_max_samples: null
  validation_datasets:
  - squad
  validation_max_samples: 2000
evaluation:
  autoregressive_every: 400
  autoregressive_max_qa: 1024
  max_new_tokens: 32
  qa_batch_size: 4
  teacher_forced_every: 200
logging:
  wandb_run_name: null
  log_every: 25
  wandb_mode: offline
  wandb_project: MemoryQwen
memory:
  memory_length: 64
  context_layer_indices:
  - -1
  memory_resampler_layers: 2
  memory_resampler_heads: 4
  memory_resampler_hidden_size: 256
  memory_resampler_ffn_ratio: 2
  reader_memory_source: memory_hidden
  readout_length: 8
  readout_hidden_size: 256
  readout_layers: 2
  readout_heads: 4
  decoder_hidden_size: 256
  decoder_heads: 8
  decoder_ffn_ratio: 2
  head_mode: tied
  head_init: auto
  qa_weight: 1.0
  recon_weight: 1.0
  token_recon_weight: 1.0
  token_recon_positions: 128
  causal_recon_weight: 0.0
  causal_recon_positions: 128
  distill_weight: 0.0
  distill_positions: 128
  distill_temperature: 1.0
  distill_topk: 0
  distill_entropy_weight: true
model:
  attn_implementation: sdpa
  context_gradient_checkpointing: true
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_rank: 8
  name_or_path: ${MODEL_ROOT:-/data/lz/hf_cache/hub}/models--Qwen--Qwen3-1.7B/snapshots/70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  torch_dtype: bfloat16
  trainable_dtype: float32
optimizer:
  lr: 0.0001
  name: adamw
  weight_decay: 0.01
scheduler:
  name: cosine
  warmup_steps: 200
training:
  batch_size: 1
  epochs: 1
  max_grad_norm: 1.0
  seed: 42
  deterministic: false
