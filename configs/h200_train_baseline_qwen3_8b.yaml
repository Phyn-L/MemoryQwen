_base_:
- train_baseline.yaml
- models/qwen3-8b.yaml

memory:
  memory_length: 128
  context_layer_indices: [-1,-2,-3,-4]
  memory_resampler_layers: 8
  memory_resampler_heads: 4
  memory_resampler_hidden_size: 768
  memory_resampler_ffn_ratio: 4

  # Question-conditioned readout
  readout_mode: memory_question
  readout_length: 32
  question_resampler_info_source: hidden
  readout_keep_question_tokens: true
  question_resampler_hidden_size: 512
  question_resampler_layers: 4
  question_resampler_heads: 4
  question_resampler_ffn_ratio: 4
  question_resampler_use_self_attention: true

training:
  batch_size: 4
  gradient_accumulation_steps: 1
  gradient_checkpoint_every_n_layers: 1
data:
  loader:
    train_num_workers: 4
    train_persistent_workers: false
  task:
    train_stage: mix
    recon_schedule: [1.0, 0.8]
    qa_schedule: [1.0, 1.0]
    recon_schedule_curve: cosine
evaluation:
  autoregressive_every: 2500  # 自回归验证与 checkpoint 的训练步间隔
  ctx_batch_size: 512
  qa_batch_size: 8  # QA 验证批大小
logging:
  log_every: 25  # 训练日志记录间隔（步）
  swanlab_mode: offline
scheduler:
  warmup_steps: 2500  # 学习率预热步数
optimizer:
  name: adamw
  lr: 5.0e-5
  weight_decay: 0.01
