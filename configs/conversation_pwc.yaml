# Conversation 格式数据配置；未列出的字段继承训练基线。
_base_: train_baseline.yaml
data:
  files:
    root: ${DATA_ROOT:-/data/lz/contexts}  # Conversation 数据根目录
    conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_pwc.jsonl  # 会话 JSONL 文件
  limits:
    max_context_tokens: 2048  # 覆盖 context token 上限
  task:
    train_tasks: qa  # 训练任务类型
