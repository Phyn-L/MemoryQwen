# 实验层：h200（8xH200）上的 baseline。只写与 harness/train_baseline 不同的部分。
_base_:
- train_baseline.yaml
data:
  loader:
    num_workers: 4
    persistent_workers: false
evaluation:
  autoregressive_every: 250  # 自回归验证与 checkpoint 的训练步间隔
  qa_batch_size: 24  # QA 验证批大小
logging:
  log_every: 25  # 训练日志记录间隔（步）
memory:
  memory_resampler_heads: 8  # memory resampler 注意力头数
scheduler:
  warmup_steps: 250  # 学习率预热步数
training:
  batch_size: 24  # 每个进程的 micro-batch 大小
