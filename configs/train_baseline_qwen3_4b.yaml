# 实验层：Qwen3-4B。只写与 train_baseline 不同的部分（模型层换成 models/qwen3-4b.yaml）。
_base_:
- train_baseline.yaml
- models/qwen3-4b.yaml
data:
  limits:
    max_context_tokens: 2048  # 覆盖 context token 上限
  task:
    test_datasets:  # 覆盖测试数据集
    - squad
    validation_datasets:  # 覆盖验证数据集
    - squad
    - msmarcov1.1
    - msmarcov2.1
    - hotpotqa(distractor)
    - race
    - musique
    - 2wikimultihopqa
evaluation:
  autoregressive_every: 400
  max_eval_contexts_per_dataset: 1024
  max_new_tokens: 32
  qa_batch_size: 4
memory:
  readout_length: 8  # readout token 数
scheduler:
  warmup_steps: 200
training:
  batch_size: 1
  deterministic: false
