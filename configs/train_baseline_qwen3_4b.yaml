checkpoint:
  output_dir: outputs
data:
  conversation_file: ${DATA_ROOT:-/data/lz/contexts}/ift_c1qa.jsonl
  cache_offsets: true
  cache_sortish_lengths: true
  chat_template_enable_thinking: false
  filter_long_context: true
  filter_no_qa: true
  max_answer_tokens: 64
  max_question_tokens: 96
  max_conversation_tokens: 768
  max_context_tokens: 2048
  max_input_tokens: 40960
  tokenizer_filter_batch_size: 2048
  train_tasks: mix
  recon_ratio: 0.5
  recon_schedule: constant
  recon_schedule_curve: linear
  recon_ratio_start: 0.5
  recon_ratio_end: 0.5
  recon_ratio_min: 0.1
  qa_per_context: 4
  root: ${DATA_ROOT:-/data/lz/contexts/aggregated}
  sortish_bucket_multiplier: 50
  test_datasets:
  - squad
  train_datasets: all
  train_max_samples: null
  validation_datasets:
  - squad
  validation_max_samples: 4096
evaluation:
  autoregressive_every: 400
  autoregressive_max_qa: 1024
  max_new_tokens: 32
  qa_batch_size: 4
logging:
  swanlab_run_name: null
  log_every: 25
  swanlab_mode: offline
  swanlab_project: MemoryQwen
memory:
  memory_length: 64
  context_layer_indices:
  - -1
  memory_resampler_layers: 2
  memory_resampler_heads: 4
  memory_resampler_hidden_size: 256
  memory_resampler_ffn_ratio: 2
  memory_resampler_output_mode: layer0
  reader_memory_source: memory_hidden
  readout_length: 8
  readout_hidden_size: 256
  readout_layers: 2
  readout_heads: 4
  qa_weight: 1.0
  recon_weight: 1.0
  distill_weight: 0.0
  distill_positions: 128
  distill_temperature: 1.0
  distill_topk: 0
  distill_entropy_weight: true
model:
  attn_implementation: sdpa
  context_gradient_checkpointing: true
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_rank: 8
  name_or_path: ${MODEL_ROOT:-/data/lz/hf_cache/hub}/models--Qwen--Qwen3-4B/snapshots/1cfa9a7208912126459214e8b04321603b3df60c
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  torch_dtype: bfloat16
  trainable_dtype: float32
optimizer:
  lr: 0.0001
  name: adamw
  weight_decay: 0.01
scheduler:
  name: cosine
  warmup_steps: 200
training:
  batch_size: 1
  epochs: 1
  max_grad_norm: 1.0
  seed: 42
  deterministic: false
